name: Pour
options:
  bundleIdPrefix: com.mayron
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
packages:
  TodoistCore:
    path: Packages/TodoistCore
targets:
  Pour:
    type: application
    platform: macOS
    sources: [macOS]
    dependencies:
      - package: TodoistCore
    info:
      path: macOS/Resources/Info.plist
      properties:
        LSUIElement: true
        CFBundleDisplayName: Pour
        CFBundleShortVersionString: "0.1.1"
        CFBundleVersion: "2"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mayron.pour
        SWIFT_VERSION: "5.9"
        # ponytail: self-signed local identity (scripts/dev-cert.sh) so Keychain trusts the app across rebuilds; no App Sandbox until a Developer ID exists.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Todoist Floating Dev"
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: false
        SWIFT_STRICT_CONCURRENCY: minimal
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
